<title>SHAPE Discovery</title>
<meta name="description" content="An interactive, mobile-friendly way for new members to discover their spiritual gifts, heart, abilities, personality, and experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
  :root{
    --ink:#241F33; --ink-soft:#5B5570; --ink-faint:#8B84A0;
    --ground:#F3F1F7; --surface:#FFFFFF; --surface-2:#FBFAFD;
    --border:#E1DEEA; --border-strong:#CFC9DD;
    --gifts:#B07A22; --gifts-fill:#B07A2214;
    --heart:#A5405A; --heart-fill:#A5405A14;
    --abilities:#237A69; --abilities-fill:#237A6914;
    --personality:#5D4A9C; --personality-fill:#5D4A9C14;
    --experience:#2E5490; --experience-fill:#2E549014;
    --accent:#5D4A9C;
    --shadow: 0 1px 2px rgba(36,31,51,.06), 0 8px 24px -12px rgba(36,31,51,.18);
    --radius: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECE9F5; --ink-soft:#B4AEC9; --ink-faint:#7C7594;
      --ground:#16131F; --surface:#1E1A2B; --surface-2:#241F35;
      --border:#332C46; --border-strong:#453C5E;
      --gifts:#E0A94E; --gifts-fill:#E0A94E1F;
      --heart:#DD7E8E; --heart-fill:#DD7E8E1F;
      --abilities:#5CC2AC; --abilities-fill:#5CC2AC1F;
      --personality:#A594E0; --personality-fill:#A594E01F;
      --experience:#7FA3E0; --experience-fill:#7FA3E01F;
      --accent:#A594E0;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECE9F5; --ink-soft:#B4AEC9; --ink-faint:#7C7594;
    --ground:#16131F; --surface:#1E1A2B; --surface-2:#241F35;
    --border:#332C46; --border-strong:#453C5E;
    --gifts:#E0A94E; --gifts-fill:#E0A94E1F;
    --heart:#DD7E8E; --heart-fill:#DD7E8E1F;
    --abilities:#5CC2AC; --abilities-fill:#5CC2AC1F;
    --personality:#A594E0; --personality-fill:#A594E01F;
    --experience:#7FA3E0; --experience-fill:#7FA3E01F;
    --accent:#A594E0;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:"Fraunces", Georgia, serif; font-weight:600; letter-spacing:-.01em;
    text-wrap:balance;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--surface); }

  .app{ max-width:760px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- Top bar / rail ---------- */
  .topbar{ position:sticky; top:0; z-index:5; background:var(--ground); padding:14px 20px 10px; }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand b{ color:var(--ink-soft); font-weight:600; }
  .step-hint{ flex:none; white-space:nowrap; }
  @media (max-width:400px){ .brand .church-name{ display:none; } }
  .progress-track{ height:4px; border-radius:4px; background:var(--border); margin-top:12px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:4px; transition:width .5s cubic-bezier(.4,0,.2,1); }

  .rail{ display:flex; gap:8px; margin-top:14px; }
  .rail-dot{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;
  }
  .rail-dot .circ{
    width:30px; height:30px; border-radius:50%; border:2px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif;
    font-weight:700; font-size:.95rem; color:var(--ink-faint); background:var(--surface);
    transition:all .3s ease;
  }
  .rail-dot.active .circ{ border-color:var(--dot); color:var(--dot); box-shadow:0 0 0 4px var(--dot-fill); }
  .rail-dot.done .circ{ border-color:var(--dot); background:var(--dot); color:var(--surface); }
  .rail-dot.active, .rail-dot.done{ color:var(--dot); }

  /* ---------- Stage ---------- */
  .stage{ flex:1; padding:8px 20px 24px; display:flex; flex-direction:column; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:28px; margin-top:10px;
  }
  .eyebrow{ font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--facet, var(--accent)); font-weight:700; margin:0 0 6px; }
  .stage h2{ font-size:1.5rem; margin:0 0 6px; }
  .lede{ color:var(--ink-soft); margin:0 0 22px; font-size:.98rem; line-height:1.55; max-width:56ch; }
  .verse{ font-family:"Fraunces",serif; font-style:italic; color:var(--ink-soft); font-size:1rem; }

  /* welcome */
  .hero-shapes{ display:flex; gap:8px; margin-bottom:20px; }
  .hero-shapes span{
    flex:1; height:64px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces",serif; font-weight:700; font-size:1.4rem; color:var(--surface);
  }
  .facet-list{ list-style:none; padding:0; margin:0 0 22px; display:flex; flex-direction:column; gap:10px; }
  .facet-list li{ display:flex; gap:12px; align-items:flex-start; font-size:.92rem; color:var(--ink-soft); }
  .facet-list .tag{ flex:none; width:26px; height:26px; border-radius:8px; color:#fff; font-family:"Fraunces",serif; font-weight:700; font-size:.85rem; display:flex; align-items:center; justify-content:center; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:.82rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border-strong);
    background:var(--surface-2); color:var(--ink); font-size:.98rem; font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:70px; }

  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .btn{
    appearance:none; border:none; cursor:pointer; padding:13px 22px; border-radius:100px;
    font-weight:600; font-size:.95rem; transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--surface); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--border-strong); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* gift swipe deck */
  .deck-wrap{ position:relative; }
  .deck-counter{ font-size:.78rem; color:var(--ink-faint); margin-bottom:10px; }
  .gift-card{
    border-radius:16px; padding:26px 24px; background:var(--facet-fill); border:1px solid var(--border);
    min-height:150px; display:flex; flex-direction:column; justify-content:center; gap:10px;
    animation:pop .25s ease;
  }
  @keyframes pop{ from{ opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;} }
  .gift-name{ font-family:"Fraunces",serif; font-weight:700; font-size:1.3rem; color:var(--facet); }
  .gift-ref{ font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); }
  .gift-desc{ color:var(--ink-soft); font-size:.98rem; line-height:1.5; }
  .rate-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px; }
  .rate-btn{
    border-radius:12px; border:1px solid var(--border-strong); background:var(--surface);
    padding:12px 6px; font-weight:600; font-size:.82rem; color:var(--ink-soft); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .rate-btn span.ic{ font-size:1.15rem; }
  .rate-btn.no:hover{ border-color:#B0495344; color:#B04953; }
  .rate-btn.maybe:hover{ border-color:var(--gifts); color:var(--gifts); }
  .rate-btn.yes:hover{ border-color:var(--abilities); color:var(--abilities); }
  .gift-tally{ display:flex; gap:14px; margin-top:16px; font-size:.78rem; color:var(--ink-faint); }
  .gift-tally b{ color:var(--ink-soft); }

  /* chip grid */
  .chip-grid{ display:flex; flex-wrap:wrap; gap:9px; }
  .chip{
    border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink-soft);
    padding:9px 15px; border-radius:100px; font-size:.88rem; cursor:pointer; text-align:left;
    transition:all .15s ease; line-height:1.3;
  }
  .chip small{ display:block; font-size:.74rem; color:var(--ink-faint); font-weight:400; }
  .chip.sel{ background:var(--facet-fill); border-color:var(--facet); color:var(--facet); font-weight:600; }
  .chip.sel small{ color:var(--facet); opacity:.8; }
  .chip:hover{ border-color:var(--facet); }
  .count-pill{ font-size:.78rem; color:var(--ink-faint); margin-top:16px; }
  @keyframes shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }
  .chip.shake{ animation:shake .4s; border-color:#B04953; color:#B04953; }

  /* personality sliders */
  .couplet{ margin-bottom:30px; }
  .couplet:last-child{ margin-bottom:6px; }
  .pole-row{ display:flex; justify-content:space-between; font-size:.86rem; font-weight:600; margin-bottom:10px; }
  .pole-row .left{ color:var(--facet); }
  .pole-row .right{ color:var(--facet); text-align:right; }
  input[type=range]{
    width:100%; -webkit-appearance:none; appearance:none; height:6px; border-radius:6px;
    background:linear-gradient(90deg, var(--facet) 0%, var(--border) 0%);
    margin:8px 0 10px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--facet);
    border:3px solid var(--surface); box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer; margin-top:-9px;
  }
  input[type=range]::-webkit-slider-runnable-track{ height:6px; border-radius:6px; }
  input[type=range]::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background:var(--facet); border:3px solid var(--surface); cursor:pointer; }
  input[type=range]::-moz-range-track{ height:6px; border-radius:6px; background:var(--border); }
  .lean-desc{ font-size:.85rem; color:var(--ink-soft); background:var(--surface-2); border-radius:10px; padding:10px 12px; }

  /* section switch (experience sub-tabs) */
  .subnav{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .subnav button{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-faint);
    padding:6px 12px; border-radius:100px; font-size:.76rem; cursor:pointer; font-weight:600;
  }
  .subnav button.on{ background:var(--facet); color:var(--surface); border-color:var(--facet); }

  .privacy-note{
    display:flex; gap:10px; align-items:flex-start; background:var(--surface-2); border:1px dashed var(--border-strong);
    border-radius:12px; padding:12px 14px; font-size:.82rem; color:var(--ink-soft); margin-top:16px;
  }

  /* nav */
  .nav{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding:0 2px; }
  .step-hint{ font-size:.78rem; color:var(--ink-faint); }

  /* availability */
  .opt-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .opt-card{
    border:1px solid var(--border-strong); background:var(--surface-2); border-radius:12px;
    padding:14px 8px; text-align:center; cursor:pointer; font-weight:600; font-size:.86rem; color:var(--ink-soft);
  }
  .opt-card.sel{ background:var(--experience-fill); border-color:var(--experience); color:var(--experience); }
  .opt-card small{ display:block; font-weight:400; color:var(--ink-faint); font-size:.72rem; margin-top:2px; }

  /* -------- results -------- */
  .profile-head{
    text-align:center; padding:34px 20px 28px; border-radius:var(--radius);
    background:linear-gradient(160deg, var(--surface), var(--surface-2));
    border:1px solid var(--border); margin-top:10px;
  }
  .profile-head .kicker{ font-size:.76rem; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-faint); margin-bottom:10px; }
  .profile-head h2{ font-size:1.9rem; margin:0 0 8px; }
  .profile-head .verse{ font-size:.95rem; }
  .sample-badge{
    display:inline-block; margin-top:14px; font-size:.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.08em; background:var(--gifts-fill); color:var(--gifts); padding:5px 12px; border-radius:100px;
  }

  .facet-panel{ border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); padding:22px 24px; margin-top:14px; }
  .facet-panel .fhead{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .facet-panel .fhead .tag{ width:32px; height:32px; border-radius:10px; color:#fff; font-family:"Fraunces",serif; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .facet-panel .fhead h3{ margin:0; font-size:1.1rem; }
  .facet-panel .fhead .sub{ font-size:.76rem; color:var(--ink-faint); margin-top:2px; }
  .badge-group{ margin-bottom:12px; }
  .badge-group:last-child{ margin-bottom:0; }
  .badge-group .glabel{ font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:7px; font-weight:700; }
  .badges{ display:flex; flex-wrap:wrap; gap:7px; }
  .badge{ padding:6px 12px; border-radius:100px; font-size:.82rem; font-weight:600; }
  .badge.solid{ background:var(--facet); color:#fff; }
  .badge.outline{ background:var(--facet-fill); color:var(--facet); border:1px solid var(--facet); }
  .empty-hint{ font-size:.85rem; color:var(--ink-faint); font-style:italic; }

  .dial-row{ margin-bottom:16px; }
  .dial-row:last-child{ margin-bottom:0; }
  .dial-labels{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--ink-faint); margin-bottom:6px; }
  .dial-labels .hi{ color:var(--facet); font-weight:700; }
  .dial-bar{ position:relative; height:8px; background:var(--border); border-radius:8px; }
  .dial-bar .fill{ position:absolute; top:0; left:0; height:100%; background:var(--facet); border-radius:8px; opacity:.35; }
  .dial-bar .mark{ position:absolute; top:50%; width:16px; height:16px; border-radius:50%; background:var(--facet); border:3px solid var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.3); transform:translate(-50%,-50%); }

  .lock-toggle{ display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--ink-faint); margin-top:10px; cursor:pointer; user-select:none; }
  .lock-toggle input{ accent-color:var(--experience); }

  .avail-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .avail-chip{ background:var(--experience-fill); color:var(--experience); padding:7px 14px; border-radius:100px; font-size:.84rem; font-weight:600; }

  .cta-panel{ text-align:center; margin-top:20px; padding:26px 22px; border-radius:var(--radius); background:var(--personality-fill); border:1px solid var(--border); }
  .cta-panel h3{ margin:0 0 6px; font-size:1.15rem; }
  .cta-panel p{ margin:0 0 16px; color:var(--ink-soft); font-size:.9rem; max-width:46ch; margin-left:auto; margin-right:auto; }

  footer.note{ text-align:center; font-size:.75rem; color:var(--ink-faint); padding:26px 20px 40px; line-height:1.6; }
  footer.note a{ text-decoration:underline; }

  @media (max-width:520px){
    .stage{ padding:8px 14px 20px; } .topbar{ padding:12px 14px 8px; }
    .card, .facet-panel{ padding:20px 18px; }
    .rate-row{ gap:7px; }
    .opt-grid{ grid-template-columns:1fr 1fr 1fr; }
    .hero-shapes span{ font-size:1.1rem; height:52px; }
  }
  @media print{
    .topbar, .nav, .cta-panel, footer.note{ display:none !important; }
    body{ background:#fff; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
</style>

<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><span class="church-name">Elkhart Life Church &nbsp;·&nbsp;</span> <b>SHAPE Discovery</b></div>
      <div class="step-hint mono" id="stepHint"></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="rail" id="rail"></div>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script>
(function(){

/* ================= DATA ================= */

var GIFTS = [

var ABILITIES = [

function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function facetOf(id){ var s=STEPS.find(function(s){return s.id===id;}); return s?s.facet:null; }
function facetInfo(key){ return FACETS.find(function(f){return f.key===key;}); }

function toggleSet(set, val){ if(set.has(val)) set.delete(val); else set.add(val); }

function renderChipGrid(container, items, selectedSet, opts){
  opts = opts || {};
  var grid = el("div","chip-grid");
  items.forEach(function(item){
    var name = typeof item === "string" ? item : item.n;
    var desc = typeof item === "string" ? null : item.d;
    var chip = el("button","chip"+(selectedSet.has(name)?" sel":""));
    chip.type="button";
    chip.innerHTML = name + (desc ? "<small>"+desc+"</small>" : "");
    chip.addEventListener("click", function(){
      toggleSet(selectedSet, name);
      chip.classList.toggle("sel");
      if(opts.onChange) opts.onChange();
    });
    grid.appendChild(chip);
  });
  container.appendChild(grid);
}

/* ================= RENDER: RAIL / PROGRESS ================= */
var LAST_FACET_STEP_IDX = (function(){ var last=-1; STEPS.forEach(function(s,i){ if(s.facet) last=i; }); return last; })();

function renderRail(){
  var rail = document.getElementById("rail");
  rail.innerHTML = "";
  var curFacet = facetOf(STEPS[cur].id);
  var curFacetOrder = curFacet ? FACETS.findIndex(function(f){return f.key===curFacet;}) : -1;

  FACETS.forEach(function(f, i){
    var dot = el("div","rail-dot");
    dot.style.setProperty("--dot", f.color);
    dot.style.setProperty("--dot-fill", f.fill);
    var state_ = "";
    if(cur > LAST_FACET_STEP_IDX){ state_ = "done"; } // all facets finished (departments / availability / results)
    else if(i < curFacetOrder) state_ = "done";
    else if(i === curFacetOrder) state_ = "active";
    if(state_) dot.classList.add(state_);
    dot.innerHTML = '<div class="circ">'+f.letter+'</div>'+f.label.split(" ")[0];
    rail.appendChild(dot);
  });

  var pct = Math.round((cur/(STEPS.length-1))*100);
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("stepHint").textContent = STEPS[cur].id==="welcome" ? "" : STEPS[cur].id==="results" ? "complete" : (cur)+" / "+(STEPS.length-2);
}

  next.addEventListener("click", function(){ if(opts.onNext) opts.onNext(); goto(cur+1); });
  nav.appendChild(back);
  nav.appendChild(next);
  container.appendChild(nav);
}

  var yes = Object.keys(state.giftRatings).filter(function(k){return state.giftRatings[k]==="yes";});
  var maybe = Object.keys(state.giftRatings).filter(function(k){return state.giftRatings[k]==="maybe";});
  stage.appendChild(panel("gifts","S","Spiritual Gifts", Object.keys(state.giftRatings).length+" of "+GIFTS.length+" reviewed", function(body){
    body.appendChild(badgeGroup("Strongest fit", yes, true));
    body.appendChild(badgeGroup("Worth exploring", maybe, false));
  }));

  /* Heart */
  stage.appendChild(panel("heart","H","Heart", "Roles, people & causes", function(body){
    body.appendChild(badgeGroup("Loves to", Array.from(state.heartRoles), true));
    body.appendChild(badgeGroup("Drawn to", Array.from(state.heartPeople), false));
    body.appendChild(badgeGroup("Cares about", Array.from(state.heartCauses), false));
  }));

  /* Abilities */
  stage.appendChild(panel("abilities","A","Abilities", state.abilities.size+" natural talents", function(body){
    body.appendChild(badgeGroup("Can do well", Array.from(state.abilities), true));
  }));

  /* Personality */
  stage.appendChild(panel("personality","P","Personality", "How you're wired", function(body){
    PERSONALITY.forEach(function(c,i){
      var v = state.personality[i];
      var row = el("div","dial-row");
      var lead = v<50 ? c.l : (v>50 ? c.r : c.l+" / "+c.r);
      var pct = v<50 ? (100-v*2) : (v>50 ? (v-50)*2 : 0);
      row.appendChild(el("div","dial-labels", '<span>'+c.l+'</span><span class="hi">'+(v!==50? lead+" · "+pct+"%":"Balanced")+'</span><span>'+c.r+'</span>'));
      var bar = el("div","dial-bar");
      var fill = el("div","fill"); fill.style.width="100%";
      var mark = el("div","mark"); mark.style.left=v+"%";
      bar.appendChild(fill); bar.appendChild(mark);
      row.appendChild(bar);
      body.appendChild(row);
    });
  }));

  /* Experience */
  stage.appendChild(panel("experience","E","Experience", "Life that shaped you", function(body){
    body.appendChild(badgeGroup("Spiritual", Array.from(state.expSpiritual), true));
    body.appendChild(badgeGroup("Education", Array.from(state.expEducation), false));
    body.appendChild(badgeGroup("Work", Array.from(state.expWork), false));
    body.appendChild(badgeGroup("Ministry", Array.from(state.expMinistry), false));
    if(state.sharePainful){
      body.appendChild(badgeGroup("Can relate to others who've faced", Array.from(state.expPainful), false));
    }
    var toggle = el("label","lock-toggle");
    var cb = el("input"); cb.type="checkbox"; cb.checked = state.sharePainful;
    cb.addEventListener("change", function(){ state.sharePainful = cb.checked; render(); });
    toggle.appendChild(cb);
    toggle.appendChild(document.createTextNode("🔒 Include my painful experiences in what I share with my SHAPE Guide"));
    body.appendChild(toggle);
  }));

  /* Department interest */
  var deptPanel = el("div","facet-panel"); deptPanel.style.setProperty("--facet","var(--accent)"); deptPanel.style.setProperty("--facet-fill","var(--personality-fill)");
  deptPanel.appendChild(fheadHTML("var(--accent)","D","Serving Interest","Departments they're drawn to"));
  var deptBody = el("div");
  deptBody.appendChild(badgeGroup("Top picks", Array.from(state.departments), true));
  if(state.departmentOther){
    var otherP = el("p","lede"); otherP.style.marginTop="10px"; otherP.style.marginBottom="0";
    otherP.innerHTML = "Also interested in: “"+esc(state.departmentOther)+"”";
    deptBody.appendChild(otherP);
  }
  deptPanel.appendChild(deptBody);
  stage.appendChild(deptPanel);

  /* Availability */
  var availPanel = el("div","facet-panel");
  availPanel.appendChild(fheadHTML("var(--experience)","E","Availability","When you can serve"));
  var strip = el("div","avail-strip");
  if(state.hours) strip.appendChild(el("span","avail-chip",state.hours+" / week"));
  if(state.time) strip.appendChild(el("span","avail-chip",state.time));
  if(!state.hours && !state.time) strip.appendChild(el("span","empty-hint","Not answered yet"));
  availPanel.appendChild(strip);
  if(state.reflection){
    var r = el("p","lede"); r.style.marginTop="14px"; r.style.marginBottom="0"; r.innerHTML = "“"+esc(state.reflection)+"”";
    availPanel.appendChild(r);
  }
  stage.appendChild(availPanel);

  /* CTA */
  var cta = el("div","cta-panel");
  cta.innerHTML = '<h3>Next: your SHAPE Discovery Session</h3><p>Bring this profile to a one-on-one conversation with a SHAPE Guide, who will help connect you to 2–3 ministries that fit — usually about an hour, most days of the week.</p>';
  var row = el("div","btnrow"); row.style.justifyContent="center";
  var email = el("button","btn btn-primary","Email Me This Profile →");
  email.addEventListener("click", function(){ sendProfileEmail(); });
  var print = el("button","btn btn-ghost","Print / Save PDF"); print.addEventListener("click", function(){ window.print(); });
  var restart = el("button","btn btn-ghost","Start over"); restart.addEventListener("click", function(){ resetState(); goto(0); });
  row.appendChild(email); row.appendChild(print); row.appendChild(restart);
  cta.appendChild(row);
  var emailNote = el("p","empty-hint"); emailNote.style.marginTop="12px"; emailNote.id="emailNote";
  emailNote.textContent = "Opens your email app with everything filled in, addressed to you with the church office (pastor@elkhartlife.com) cc'd — just hit send.";
  cta.appendChild(emailNote);
  stage.appendChild(cta);

  stage.appendChild(el("footer","note","Built from the Elkhart Life Church SHAPE Interview Booklet · Spiritual Gifts, Heart, Abilities, Personality &amp; Experience"));
}

function fheadHTML(color, letter, title, sub){
  var d = el("div","fhead");
  var tag = el("span","tag",letter); tag.style.background=color;
  var t = el("div"); t.innerHTML = "<h3>"+title+"</h3><div class='sub'>"+sub+"</div>";
  d.appendChild(tag); d.appendChild(t);
  return d;
}

function panel(facetKey, letter, title, sub, fill){
  var f = facetInfo(facetKey);
  var p = el("div","facet-panel"); p.style.setProperty("--facet",f.color); p.style.setProperty("--facet-fill",f.fill);
  p.appendChild(fheadHTML(f.color, letter, title, sub));
  var body = el("div");
  fill(body);
  p.appendChild(body);
  return p;
}

function badgeGroup(label, arr, solid){
  var g = el("div","badge-group");
  g.appendChild(el("div","glabel",label));
  var b = el("div","badges");
  if(arr.length===0){ b.appendChild(el("span","empty-hint","None selected")); }
  else arr.forEach(function(x){ b.innerHTML += badge(esc(x), solid); });
  g.appendChild(b);
  return g;
}

function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
var PASTOR_EMAIL = "pastor@elkhartlife.com";
var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function listOr(arr, fallback){ return arr.length ? arr.join(", ") : (fallback || "None marked"); }

function buildEmailBody(){
  var yes = Object.keys(state.giftRatings).filter(function(k){return state.giftRatings[k]==="yes";});
  var maybe = Object.keys(state.giftRatings).filter(function(k){return state.giftRatings[k]==="maybe";});
  var lines = [];
  lines.push((state.name?state.name:"New member")+"'s SHAPE Profile — Elkhart Life Church");
  lines.push('"You are wonderfully complex." — Psalm 139:14');
  lines.push("");
  lines.push("SPIRITUAL GIFTS (S)");
  lines.push("Strongest fit: "+listOr(yes));
  if(maybe.length) lines.push("Worth exploring: "+listOr(maybe));
  lines.push("");
  lines.push("HEART (H)");
  lines.push("Loves to: "+listOr(Array.from(state.heartRoles)));
  lines.push("Drawn to: "+listOr(Array.from(state.heartPeople)));
  lines.push("Cares about: "+listOr(Array.from(state.heartCauses)));
  lines.push("");
  lines.push("ABILITIES (A)");
  lines.push(listOr(Array.from(state.abilities)));
  lines.push("");
  lines.push("PERSONALITY (P)");
  PERSONALITY.forEach(function(c,i){
    var v = state.personality[i];
    var lead = v===50 ? "Balanced" : (v<50 ? c.l : c.r);
    lines.push(c.l+" / "+c.r+": "+lead);
  });
  lines.push("");
  lines.push("EXPERIENCE (E)");
  lines.push("Spiritual: "+listOr(Array.from(state.expSpiritual)));
  lines.push("Education: "+listOr(Array.from(state.expEducation)));
  lines.push("Work: "+listOr(Array.from(state.expWork)));
  lines.push("Ministry: "+listOr(Array.from(state.expMinistry)));
  if(state.sharePainful && state.expPainful.size){
    lines.push("Can relate to others who've faced: "+listOr(Array.from(state.expPainful)));
  }
  lines.push("");
  lines.push("WHERE THEY'D LIKE TO SERVE");
  lines.push(listOr(Array.from(state.departments)));
  if(state.departmentOther) lines.push("Also interested in: "+state.departmentOther);
  lines.push("");
  lines.push("AVAILABILITY");
  lines.push((state.hours||"Not answered")+" · "+(state.time||"Not answered"));
  if(state.reflection){ lines.push(""); lines.push('"'+state.reflection+'"'); }
  lines.push("");
  lines.push("Next step: schedule your SHAPE Discovery Session with a SHAPE Guide.");
  return lines.join("\n");
}

function sendProfileEmail(){
  var note = document.getElementById("emailNote");
  if(!state.email || !EMAIL_RE.test(state.email)){
    if(note){ note.textContent = "Add a valid email address on the first screen before sending — tap Back to the start to fill it in."; note.style.color = "#B04953"; }
    return;
  }
  var subject = (state.name?state.name+"’s":"My")+" SHAPE Profile — Elkhart Life Church";
  var body = buildEmailBody();
  var href = "mailto:"+encodeURIComponent(state.email)+"?cc="+encodeURIComponent(PASTOR_EMAIL)+"&subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  window.location.href = href;
}

function resetState(){
  state = {
    name:"", email:"", reflection:"", giftIdx:0, giftRatings:{},
    heartRoles:new Set(), heartPeople:new Set(), heartCauses:new Set(),
    abilities:new Set(), personality:[50,50,50,50],
    expSpiritual:new Set(), expPainful:new Set(), expEducation:new Set(), expWork:new Set(), expMinistry:new Set(),
    sharePainful:true, departments:new Set(), departmentOther:"", hours:null, time:null, isSample:false
  };
}

/* ================= MAIN RENDER ================= */
function render(){
  stage.innerHTML = "";
  renderRail();
  var id = STEPS[cur].id;
  if(id==="welcome") renderWelcome();
  else if(id==="gifts") renderGifts();
  else if(id==="heart-roles") renderHeartRoles();
  else if(id==="heart-people") renderHeartPeople();
  else if(id==="heart-causes") renderHeartCauses();
  else if(id==="abilities") renderAbilities();
  else if(id==="personality") renderPersonality();
  else if(id in EXP_STEP_MAP) renderExperience(id);
  else if(id==="departments") renderDepartments();
  else if(id==="availability") renderAvailability();
  else if(id==="results") renderResults();
}

document.addEventListener("DOMContentLoaded", function(){
  stage = document.getElementById("stage");
  render();
});
})();
</script>
