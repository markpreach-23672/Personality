{
  id:"four-colors",
  name:"Four Colors",
  subtitle:"The four classic temperaments, in color",
  description:"For 2,400 years people have described human temperament in four broad types — the ancients called them sanguine, choleric, melancholic, and phlegmatic. Colors are simply an easier way to remember them. Everyone is a blend of all four; most of us lead with one or two. This is about how you're wired, not what you're good at.",

/* ============================================================
   SCORING + SYNTHESIS
============================================================ */
function scoreTest(test,answers){
  if(test.sections)return scoreProfile(test,answers);
  const totals={},counts={};
  test.types.forEach(t=>{totals[t.id]=0;counts[t.id]=0;});
  test.questions.forEach((q,i)=>{const a=answers[i];if(typeof a==="number"){totals[q.typeId]+=a;counts[q.typeId]++;}});
  const s=test.scale,pct={},raw={},rawMax={};
  test.types.forEach(t=>{
    const mx=counts[t.id]*s.max,mn=counts[t.id]*s.min;
    pct[t.id]=mx>mn?Math.round(((totals[t.id]-mn)/(mx-mn))*100):0;
    raw[t.id]=totals[t.id];rawMax[t.id]=mx;
  });
  // Rank by normalized score, high to low; ties break by the order types are declared.
  // (With equal items per type this equals ranking by raw sum; normalizing keeps
  //  uneven custom tests fair.)
  const order={};test.types.forEach((t,i)=>order[t.id]=i);
  const ranking=[...test.types].map(t=>t.id).sort((a,b)=> pct[b]-pct[a] || order[a]-order[b]);
  return {pct,raw,rawMax,ranking,leading:ranking.slice(0,2),quiet:ranking.slice(-2)};
}

/* Profile scoring: each section is scored on its own; the person's top picks
   within each section form the profile. Letter-level scores keep the test
   compatible with the team views. */
function scoreProfile(test,answers){
  const totals={},counts={};
  test.questions.forEach((q,i)=>{const a=answers[i];
    if(typeof a==="number"){totals[q.typeId]=(totals[q.typeId]||0)+a;counts[q.typeId]=(counts[q.typeId]||0)+1;}});
  const s=test.scale,pct={},picks={};
  Object.keys(test.optionMap).forEach(id=>{
    const c=counts[id]||0,mx=c*s.max,mn=c*s.min;
    pct[id]=mx>mn?Math.round(((totals[id]-mn)/(mx-mn))*100):0;
  });
  // top picks per section, and a letter-level score = best option in that section
  test.sections.forEach(sec=>{
    let chosen;
    if(sec.pairs){
      // Opposing traits: report the stronger side of each pair (never both).
      chosen=sec.pairs.map(([a,b])=>{const ia=sec.key+":"+a,ib=sec.key+":"+b;return pct[ia]>=pct[ib]?ia:ib;});
    }else{
      const ids=sec.options.map(o=>sec.key+":"+o.id).sort((a,b)=>pct[b]-pct[a]);
      const top=pct[ids[0]]||0;
      // Only surface picks that are genuinely strong and close to the person's best.
      chosen=ids.filter(id=>pct[id]>=50&&pct[id]>=top-25).slice(0,3);
      if(!chosen.length)chosen=ids.slice(0,1);
    }
    picks[sec.key]=chosen;
    pct[sec.key]=Math.round(chosen.reduce((a,id)=>a+pct[id],0)/chosen.length);
  });
  const ranking=test.types.map(t=>t.id).sort((a,b)=>pct[b]-pct[a]);
  return {pct,picks,ranking,leading:ranking.slice(0,2),quiet:ranking.slice(-2)};
}

function synthesize(test,results){
  const rel=results.filter(r=>r.testId===test.id);
  const people=rel.length;
  const names=[...new Set(rel.map(r=>r.name))];
  const per={};
  test.types.forEach(t=>{per[t.id]={type:t,leaders:[],avg:0,sum:0};});
  rel.forEach(r=>{
    r.leading.forEach(id=>{if(per[id])per[id].leaders.push(r.name);});
    test.types.forEach(t=>{per[t.id].sum += (r.pct[t.id]||0);});
  });
  test.types.forEach(t=>{per[t.id].avg = people? Math.round(per[t.id].sum/people):0;});
  const ranked=test.types.map(t=>per[t.id]).sort((a,b)=>b.leaders.length-a.leaders.length);
  const gaps=ranked.filter(x=>x.leaders.length===0);
  const covered=ranked.filter(x=>x.leaders.length>0);
  const topConc=ranked[0];
  const overConc = people>=3 && topConc.leaders.length > people*0.5 ? topConc : null;
  // find best growth candidate for a gap: person (not already leading it) with highest pct in that type
  function growthFor(typeId){
    const cand=rel.filter(r=>!r.leading.includes(typeId)).sort((a,b)=>(b.pct[typeId]||0)-(a.pct[typeId]||0))[0];
    return cand? {name:cand.name,pct:cand.pct[typeId]||0}:null;
  }
  // phase balance (built-in only)
  let phase=null;
  if(test.phases){
    phase=test.phases.map(ph=>{
      let leaderSlots=0;
      rel.forEach(r=>{r.leading.forEach(id=>{if(ph.types.includes(id))leaderSlots++;});});
      return {...ph,slots:leaderSlots};
    });
  }
  return {test,people,names:names.length,rel,per,ranked,gaps,covered,topConc,overConc,growthFor,phase};
}

/* ============================================================
   COMBINED PROFILE ENGINE — weaves all assessments together
   Working Strengths & Serving Strengths share one underlying
   "contribution spine"; Colors adds temperament; Ministry
   Leadership adds leadership practices.
============================================================ */
const SPINE=[
  {id:"noticing", label:"Noticing",  blurb:"sees needs and asks why",   color:"#C0912B"},
  {id:"imagining",label:"Imagining", blurb:"brings new ideas",          color:"#7A5EA6"},
  {id:"discerning",label:"Discerning",blurb:"weighs what's wise",       color:"#2F7E76"},
  {id:"rallying", label:"Rallying",  blurb:"gets people moving",        color:"#C25A6B"},
  {id:"helping",  label:"Helping",   blurb:"comes alongside",           color:"#5A8A57"},
  {id:"finishing",label:"Finishing", blurb:"sees it through",           color:"#3E6699"}
];
const SPINE_MAP={
  "working-strengths":{notice:"noticing",dream:"imagining",weigh:"discerning",rally:"rallying",help:"helping",finish:"finishing"},
  "serving-strengths":{seeker:"noticing",maker:"imagining",sifter:"discerning",sparker:"rallying",responder:"helping",completer:"finishing"}
};
const COLOR_WORD={scarlet:"drive",amber:"warmth",indigo:"depth",evergreen:"steadiness"};

function spineLabel(id){return (SPINE.find(s=>s.id===id)||{}).label||id;}
function personResults(name,all){return all.filter(r=>r.kind!=="observer"&&r.name.toLowerCase()===name.toLowerCase());}
function allPeople(all){
  const seen=new Map();
  all.filter(r=>r.kind!=="observer").forEach(r=>{const k=r.name.toLowerCase();if(!seen.has(k))seen.set(k,r.name);});
  return [...seen.values()].sort((a,b)=>a.localeCompare(b));
}

// Merge a person's spine scores across whichever spine tests they took (average pct per role)
function personSpine(rs){
  const acc={},cnt={},contributors={};SPINE.forEach(s=>{acc[s.id]=0;cnt[s.id]=0;contributors[s.id]=[];});
  const spineTests=[];
  rs.forEach(r=>{const map=SPINE_MAP[r.testId];if(!map)return;spineTests.push(r.testId);
    Object.keys(map).forEach(typeId=>{const role=map[typeId];acc[role]+=(r.pct[typeId]||0);cnt[role]++;});});
  if(spineTests.length===0)return null;
  const avg={};SPINE.forEach(s=>{avg[s.id]=cnt[s.id]?Math.round(acc[s.id]/cnt[s.id]):0;});
  const ranked=SPINE.map(s=>s.id).sort((a,b)=>avg[b]-avg[a]||SPINE.findIndex(s=>s.id===a)-SPINE.findIndex(s=>s.id===b));
  // agreement between the two spine tests, if both taken
  let agreement=null;
  const ws=rs.find(r=>r.testId==="working-strengths"),ss=rs.find(r=>r.testId==="serving-strengths");
  if(ws&&ss){
    const top=r=>r.leading.map(id=>SPINE_MAP[r.testId][id]);
    const a=top(ws),b=top(ss);const overlap=a.filter(x=>b.includes(x)).length;
    agreement=overlap===2?"strong":overlap===1?"partial":"low";
  }
  return {avg,ranked,top:ranked.slice(0,2),spineTests:[...new Set(spineTests)],agreement};
}
function personColor(rs){
  const r=rs.find(x=>x.testId==="four-colors");if(!r)return null;
  const t=findTest("four-colors");const top=r.leading[0];const ty=t.types.find(x=>x.id===top);
  return {id:top,name:ty?ty.name:top,word:COLOR_WORD[top]||"",color:ty?ty.color:"#888",second:r.leading[1]};
}
function personLeadership(rs){
  const r=rs.find(x=>x.testId==="ministry-leadership");if(!r)return null;
  const t=findTest("ministry-leadership");
  return {top:r.leading.map(id=>{const ty=t.types.find(x=>x.id===id);return ty?ty.name:id;})};
}
function combinePerson(name,all){
  const rs=personResults(name,all);
  return {name,taken:rs.map(r=>({id:r.testId,name:r.testName})),spine:personSpine(rs),color:personColor(rs),leadership:personLeadership(rs),results:rs};
}
function personNarrative(P){
  const bits=[];
  if(P.spine){
    const [a,b]=P.spine.top;
    bits.push(`${P.name.split(/\s+/)[0]} contributes most through ${spineLabel(a)} and ${spineLabel(b)} — ${(SPINE.find(s=>s.id===a)||{}).blurb} and ${(SPINE.find(s=>s.id===b)||{}).blurb}.`);
    if(P.spine.agreement==="strong")bits.push("Both strengths assessments agree closely, so that's a dependable read.");
    else if(P.spine.agreement==="low")bits.push("The two strengths assessments point in different directions — worth a conversation about which fits better.");
  }
  if(P.color)bits.push(`Temperament leans ${P.color.name}${P.color.word?" ("+P.color.word+")":""}.`);
  if(P.leadership)bits.push(`In leadership, strongest at ${listJoin(P.leadership.top)}.`);
  return bits.join(" ");
}

// Whole-team combined picture
function combineTeam(all){
  const people=allPeople(all);
  const profiles=people.map(n=>combinePerson(n,all));
  // spine coverage: a person "leads" a role if it's in their merged top-2
  const spineCov=SPINE.map(s=>{
    const leaders=profiles.filter(p=>p.spine&&p.spine.top.includes(s.id)).map(p=>p.name);
    return {role:s,leaders};
  }).sort((a,b)=>b.leaders.length-a.leaders.length);
  const spineGaps=spineCov.filter(x=>x.leaders.length===0 && profiles.some(p=>p.spine));
  // temperament mix
  const colorMix={};profiles.forEach(p=>{if(p.color){colorMix[p.color.id]=colorMix[p.color.id]||{name:p.color.name,color:p.color.color,people:[]};colorMix[p.color.id].people.push(p.name);}});
  const outgoing=(colorMix.scarlet?colorMix.scarlet.people.length:0)+(colorMix.amber?colorMix.amber.people.length:0);
  const reserved=(colorMix.indigo?colorMix.indigo.people.length:0)+(colorMix.evergreen?colorMix.evergreen.people.length:0);
  // leadership profiles present
  const leaders=profiles.filter(p=>p.leadership).map(p=>p.name);
  // complementary pairing: strongest imaginer + strongest finisher (by merged avg)
  function strongestIn(role){let best=null;profiles.forEach(p=>{if(p.spine){const v=p.spine.avg[role];if(best===null||v>best.v)best={name:p.name,v};}});return best;}
  const pair=(()=>{const im=strongestIn("imagining"),fi=strongestIn("finishing");
    if(im&&fi&&im.name!==fi.name)return {a:im.name,b:fi.name};return null;})();
  return {profiles,spineCov,spineGaps,colorMix,outgoing,reserved,leaders,pair,
    hasSpine:profiles.some(p=>p.spine),hasColor:profiles.some(p=>p.color)};
}
function teamNarrative(T){
  const bits=[];
  const strong=T.spineCov.filter(x=>x.leaders.length>0).slice(0,2).map(x=>x.role.label);
  if(strong.length)bits.push(`Across our strengths assessments, the team is richest in ${listJoin(strong)}.`);
  if(T.spineGaps.length)bits.push(`No one currently leads in ${listJoin(T.spineGaps.map(x=>x.role.label))} — a place to grow or invite others in.`);
  if(T.hasColor){
    if(T.outgoing>T.reserved*1.6)bits.push("Temperament skews outgoing — plenty of energy and initiative; make room for the quieter, steadier voices.");
    else if(T.reserved>T.outgoing*1.6)bits.push("Temperament skews reserved — thoughtful and steady; lean on your outgoing members to start and rally.");
    else if(T.outgoing+T.reserved>0)bits.push("Temperament is balanced between outgoing and reserved — energy and ballast both present.");
  }
  return bits.join(" ");
}

/* window signature */
/* A stained-glass window whose panes are the test's strengths.
   Pane brightness = how strongly that strength shows up. Adapts to 2–8 types. */
function windowSVG(test,pcts){
  const types=test.types.slice(0,8),n=types.length;
  const cols=n<=2?n:(n<=4?2:3),rows=Math.ceil(n/cols);
  const L=22,T=24,R=314,B=320,gap=10,W=R-L,H=B-T;
  const pw=(W-gap*(cols-1))/cols, ph=(H-gap*(rows-1))/rows;
  let panes="";
  for(let i=0;i<n;i++){
    const row=Math.floor(i/cols), idx=i-row*cols;
    const inRow=Math.min(cols,n-row*cols);
    const rowW=inRow*pw+gap*(inRow-1);
    const x=(L+(W-rowW)/2+idx*(pw+gap)).toFixed(1), y=(T+row*(ph+gap)).toFixed(1);
    const p=pcts?Math.max(0.18,(pcts[types[i].id]||0)/100):0.62;
    panes+=`<rect class="pane" x="${x}" y="${y}" width="${pw.toFixed(1)}" height="${ph.toFixed(1)}" rx="8" fill="${types[i].color}" opacity="${p.toFixed(2)}"><title>${esc(types[i].name)}</title></rect>
      <rect x="${x}" y="${y}" width="${pw.toFixed(1)}" height="${ph.toFixed(1)}" rx="8" fill="none" stroke="#211C33" stroke-width="2" opacity=".5"/>`;
  }
  return `<svg class="window" viewBox="0 0 336 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stained-glass window of ${n} strengths">
    <path d="M20 20 Q20 8 32 8 H304 Q316 8 316 20 V320 Q316 330 306 330 H30 Q20 330 20 320 Z" fill="#EFEBDF" stroke="#211C33" stroke-width="3"/>${panes}</svg>`;
}

function beginTest(){

/* TAKE */
const PAGE=6;
function renderTake(){
  const t=findTest(STATE.testId);if(!t)return go("home");
  const total=t.questions.length,start=PAGE_IDX*PAGE,end=Math.min(start+PAGE,total);
  const answered=STATE.answers.filter(a=>a!==null).length,pct=Math.round(answered/total*100),s=t.scale;
  const observer=STATE.kind==="observer";
  const qtextOf=q=>observer?(q.observerText||q.text.replace(/^I /,"They ").replace(/\bmy\b/g,"their").replace(/\bme\b/g,"them")):q.text;
  let qhtml="";
  for(let i=start;i<end;i++){const q=t.questions[i];
    qhtml+=`<div class="q"><div class="qtext"><span class="qnum">${i+1}.</span>${esc(qtextOf(q))}</div><div class="scale" style="grid-template-columns:repeat(${s.max-s.min+1},1fr)">${
      Array.from({length:s.max-s.min+1},(_,k)=>{const val=s.min+k;const on=STATE.answers[i]===val?"on":"";
      const lbl=(s.labels&&s.labels[k]!=null)?s.labels[k]:(val===s.min?s.lowLabel:(val===s.max?s.highLabel:""));
      return `<button class="${on}" onclick="answer(${i},${val})" aria-pressed="${on?'true':'false'}"><span class="dot"></span><span>${lbl||val}</span></button>`;}).join("")
    }</div></div>`;}
  const lastPage=end>=total,pageDone=t.questions.slice(start,end).every((_,i)=>STATE.answers[start+i]!==null);
  app().innerHTML=`
  <button class="back" onclick="takeBack()">&larr; Back</button>
  <div class="panel narrow">
    ${observer?`<div class="callout info" style="margin-bottom:16px">You're rating <b>${esc(STATE.subject)}</b>. Answers are combined with other people's.</div>`:""}
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><div class="eyebrow">${esc(t.name)}</div><div class="muted" style="font-size:14px">${answered} of ${total}</div></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin:20px 0 6px">${qhtml}</div>
    <div style="display:flex;gap:12px;justify-content:space-between;margin-top:20px;flex-wrap:wrap">
      <button class="btn ghost" onclick="pageStep(-1)" ${PAGE_IDX===0?'disabled':''}>Previous</button>
      ${lastPage?`<button class="btn gold" onclick="finishTest()" ${answered<total?'disabled':''}>See my report &rarr;</button>`:`<button class="btn" onclick="pageStep(1)" ${!pageDone?'disabled':''}>Next &rarr;</button>`}
    </div>
    ${!pageDone&&!lastPage?'<p class="hint" style="text-align:right">Answer each question to continue.</p>':''}
    ${lastPage&&answered<total?'<p class="hint" style="text-align:right">A few questions are still blank — scroll up to finish them.</p>':''}
  </div>`;
}
function answer(i,v){STATE.answers[i]=v;renderTake();}
function takeBack(){if(PAGE_IDX>0)pageStep(-1);else go('start',{testId:STATE.testId});}
function pageStep(d){const t=findTest(STATE.testId);const mp=Math.ceil(t.questions.length/PAGE)-1;PAGE_IDX=Math.max(0,Math.min(mp,PAGE_IDX+d));window.scrollTo({top:0});renderTake();}
function finishTest(){
  const t=findTest(STATE.testId);const res=scoreTest(t,STATE.answers);

}

/* ---- SHAPE profile report ---- */
function pickName(t,id){const o=t.optionMap[id];return o?o.name:id;}
function profileNarrative(r,t){
  const first=(r.name||"").split(/\s+/)[0];
  const S=(r.picks.S||[]).map(id=>pickName(t,id));
  const H=(r.picks.H||[]).map(id=>pickName(t,id));
  const A=(r.picks.A||[]).map(id=>pickName(t,id));
  const P=(r.picks.P||[]).map(id=>pickName(t,id));
  const E=(r.picks.E||[]).map(id=>pickName(t,id));
  const bits=[];
  if(S.length)bits.push(`${first}'s strongest spiritual gifting shows up in ${listJoin(S)}.`);
  if(H.length)bits.push(`${first}'s heart leans toward ${listJoin(H)}.`);
  if(A.length)bits.push(`Practically, ${first} brings ${listJoin(A)}.`);
  if(P.length)bits.push(`In temperament, ${first} is ${listJoin(P.map(x=>x.toLowerCase()))}.`);
  if(E.length)bits.push(`Life has shaped ${first} through ${listJoin(E)}.`);
  if(S.length&&H.length)bits.push(`Put together, a good fit would be a place where ${S[0].toLowerCase()} meets a heart for ${H[0].toLowerCase()}.`);
  return bits.join(" ");
}
function shapeEmailText(r,t){
  const L=[];
  L.push(`YOUR SHAPE FOR MINISTRY — ${r.name}`);
  if(r.role)L.push(r.role);
  L.push(new Date(r.date).toLocaleDateString());
  L.push("");
  L.push(profileNarrative(r,t));
  L.push("");
  t.sections.forEach(sec=>{
    L.push(sec.name.toUpperCase()+" — "+sec.lead);
    (r.picks[sec.key]||[]).forEach(id=>{
      const o=t.optionMap[id];
      L.push("  • "+o.name+" ("+r.pct[id]+"%) — "+o.desc);
    });
    L.push("");
  });
  L.push("“As every man hath received the gift, even so minister the same one to another.” — 1 Peter 4:10 (KJV)");
  L.push("");
  L.push((CHURCH.name||"")+" · Church Strengths");
  return L.join("\n");
}

function typeBlock(ty,scoreLabel){
  return `<div class="tblock" style="border-top-color:${ty.color}">
    <h4><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${ty.color}"></span>${esc(ty.name)}${scoreLabel?`<span style="margin-left:auto;font-family:'Public Sans',sans-serif;font-size:12px;font-weight:700;color:var(--ink-faint)">${esc(scoreLabel)}</span>`:""}</h4>

    <dl>${ty.bring?`<dt>You bring</dt><dd>${esc(ty.bring)}</dd>`:""}${ty.team?`<dt>On a team</dt><dd>${esc(ty.team)}</dd>`:""}${ty.watch?`<dt>Gentle watch-out</dt><dd>${esc(ty.watch)}</dd>`:""}</dl>
    ${ty.verse?`<div class="verse">\u201c${esc(ty.verse)}\u201d<cite>${esc(ty.verseRef||"")}</cite></div>`:""}</div>`;
}
function buildEmailSummaryHtml(t,r){
  if(t.profile){

      const picks=(r.picks[sec.key]||[]).map(id=>{const o=t.optionMap[id];
        return `<div style="margin:8px 0"><b>${esc(o.name)}</b> (${r.pct[id]}%)<br><span style="color:#555">${esc(o.desc)}</span></div>`;}).join("");
      return `<h3 style="margin:18px 0 4px;font-size:15px">${esc(sec.name)}</h3>${picks}`;
    }).join("");
    return `<div>${secHtml}</div>`;

  const bars=(r.ranking||[]).map(id=>{const ty=by(id);return `<div style="margin:6px 0"><b>${esc(ty.name||id)}</b>: ${r.pct[id]}%</div>`;}).join("");
  const leadNames=(r.leading||[]).map(id=>esc(by(id).name||id)).join(", ");
  const quietNames=(r.quiet||[]).map(id=>esc(by(id).name||id)).join(", ");
  return `<div>
    ${leadNames?`<p><b>Leading strengths:</b> ${leadNames}</p>`:""}
    ${bars}
    ${quietNames?`<p style="color:#888;margin-top:10px"><b>Quieter strengths:</b> ${quietNames}</p>`:""}

}
async function sendReportEmail(r,t){
  if(!CLOUD||!CHURCH.id||!r.email)return {ok:false,error:"missing church or email"};
  try{
    const resp=await fetch(SUPA.url+"/functions/v1/send-report",{
      method:"POST",
      headers:H(),
      body:JSON.stringify({churchId:CHURCH.id,studentName:r.name,studentEmail:r.email,testName:r.testName||(t&&t.name)||"assessment",summaryHtml:buildEmailSummaryHtml(t,r)})
    });
    const data=await resp.json().catch(()=>null);
    return {ok:!!(resp.ok&&data&&data.ok),data};
  }catch(e){return {ok:false,error:e.message};}
}

function setSyn(id){SYN_TEST=id;renderSynth();}
function pctOfPeople(x,S){return S.people?Math.round(x.leaders.length/S.people*100):0;}
function synthLede(S){
  const strong=S.ranked.filter(x=>x.leaders.length>0).slice(0,2).map(x=>x.type.name);
  const gapNames=S.gaps.map(x=>x.type.name);
  let l=`As a team, our clearest strengths are ${listJoin(strong)}. `;
  if(gapNames.length) l+=`We currently have no one leading in ${listJoin(gapNames)} — a place to grow or invite others in. `;
  else l+=`Every strength has at least one leader — a well-rounded body. `;
  return l.trim();
}
function phaseBlock(S){
  const total=S.phase.reduce((a,b)=>a+b.slots,0)||1;
  const bars=S.phase.map(ph=>`<div style="background:${ph.color};width:${Math.max(8,Math.round(ph.slots/total*100))}%">${ph.name} ${Math.round(ph.slots/total*100)}%</div>`).join("");
  const a=S.phase[0],b=S.phase[1];
  // Within a lagging phase, name only the strengths that are actually thin —
  // never the ones the team already leads in.
  function thinNames(ph){
    const inPhase=ph.types.map(id=>S.per[id]);
    const min=Math.min(...inPhase.map(x=>x.leaders.length));
    return inPhase.filter(x=>x.leaders.length===min).map(x=>x.type.name);
  }
  function leanNote(lead,other){
    return `The team leans toward ${lead.name.toLowerCase()} — ${lead.lean}. The thinnest spot on the ${other.name.toLowerCase()} side is ${listJoin(thinNames(other))}; ${lead.otherRisk}.`;
  }
  let note;
  if(a.slots>b.slots*1.6) note=leanNote(a,b);
  else if(b.slots>a.slots*1.6) note=leanNote(b,a);
  else note=S.test.phaseBalanced||"The team is well balanced across both sides — keep both voices at the table.";
  return `<h3>${esc(a.name)} &amp; ${esc(b.name.toLowerCase())}</h3><div class="balance">${bars}</div><p class="muted" style="margin-top:6px">${esc(note)}</p>`;
}
function synthRecs(S){
  const recs=[];
  const covered=S.covered.slice(0,2).map(x=>x.type.name);
  if(covered.length)recs.push({title:"Lean into your strengths",body:`Your team is well-supplied in ${listJoin(covered)}. Give these people room to lead where they're gifted, and let others learn from them.`});
  S.gaps.forEach(g=>{const cand=S.growthFor(g.type.id);
    recs.push({title:`Gap: ${g.type.name}`,body:`No one currently leads here.${cand&&cand.pct>=55?` ${cand.name} scores highest in this area and could grow into it.`:""} Consider inviting someone with this strength onto the team, or covering it intentionally when you plan.`});});
  if(S.overConc)recs.push({title:`A lot of ${S.overConc.type.name}s`,body:`Over half the team leads in ${S.overConc.type.name}. That's real horsepower, but ${lower(S.overConc.type.watch||"watch that other strengths still get a voice.")}`});
  if(S.gaps.length===0&&!S.overConc)recs.push({title:"A balanced body",body:"Every strength is represented and no single one dominates. This is a healthy mix — protect it as the team grows by keeping an eye on which strengths new members bring."});
  return recs;
}
function coveragePanelInline(test,S){
  const rows=test.types.map(ty=>{const p=S.per[ty.id];const ppl=p.leaders;
    const flag=ppl.length===0?`<span class="cov-flag gap">Gap</span>`:`<span class="cov-flag ok">${ppl.length}</span>`;
    const dots=ppl.map(n=>`<span class="p" title="${esc(n)}">${initials(n)}</span>`).join("")||`<span class="muted" style="font-size:13px">No one leads here yet</span>`;
    return `<div class="cov-row"><div class="cname"><span class="sw" style="background:${ty.color}"></span>${esc(ty.name)} <span class="muted" style="font-weight:400">· team avg ${p.avg}%</span></div><div class="dots">${dots}</div>${flag}</div>`;}).join("");
  return `<div style="margin-top:6px">${rows}</div>`;
}

/* ---- 360° feedback ---- */
function leadersWithFeedback(all){
  const map={};
  all.filter(r=>r.kind==="observer"&&r.subject).forEach(r=>{
    const key=r.testId+"||"+r.subject.toLowerCase();
    if(!map[key]){const t=findTest(r.testId);map[key]={subject:r.subject,testId:r.testId,testName:t?t.name:r.testName,raters:0,hasSelf:false};}
    map[key].raters++;
  });
  Object.values(map).forEach(s=>{
    s.hasSelf=all.some(r=>r.kind!=="observer"&&r.testId===s.testId&&r.name.toLowerCase()===s.subject.toLowerCase());
  });
  return Object.values(map).sort((a,b)=>b.raters-a.raters);
}
function leaderFeedback(testId,subject,all){
  const t=findTest(testId);
  const self=all.find(r=>r.kind!=="observer"&&r.testId===testId&&r.name.toLowerCase()===subject.toLowerCase())||null;
  const obs=all.filter(r=>r.kind==="observer"&&r.testId===testId&&r.subject&&r.subject.toLowerCase()===subject.toLowerCase());
  const per=t.types.map(ty=>{
    const selfPct=self?(self.pct[ty.id]||0):null;
    const obsAvg=obs.length?Math.round(obs.reduce((a,r)=>a+(r.pct[ty.id]||0),0)/obs.length):null;
    const delta=(selfPct!=null&&obsAvg!=null)?selfPct-obsAvg:null;
    return {type:ty,selfPct,obsAvg,delta};
  });
  const withDelta=per.filter(p=>p.delta!=null);
  const blind=withDelta.filter(p=>p.delta>=15).sort((a,b)=>b.delta-a.delta);   // rates self higher than others do
  const hidden=withDelta.filter(p=>p.delta<=-15).sort((a,b)=>a.delta-b.delta);  // others rate higher than self
  const aligned=withDelta.filter(p=>Math.abs(p.delta)<15);
  return {test:t,subject,self,obs,per,blind,hidden,aligned};
}

  app().innerHTML=`

  <div class="sec-head"><div><div class="eyebrow">${esc(F.test.name)} · 360° feedback</div><h2>${esc(F.subject)}</h2>

    <div style="display:flex;gap:16px;font-size:13px;color:var(--ink-faint);margin-bottom:10px"><span>▬ lighter = self</span><span>▬ solid = team average</span></div>
    ${rows}
    <div class="sec-head" style="margin:24px 0 6px"><div><h2 style="font-size:22px">What stands out</h2></div></div>
    ${insight.map(i=>`<div class="rec"><b>${esc(i.t)}</b>${i.b}</div>`).join("")}
    <div class="callout" style="margin-top:18px">Feedback is anonymous by design — this shows the group average, never who said what. Treat gaps as questions to explore together, in a spirit of grace.</div>
  </div>`;
  requestAnimationFrame(()=>{document.querySelectorAll('.fill').forEach(f=>{setTimeout(()=>f.style.width=f.dataset.w+"%",60);});});
}

/* BUILDER */
function blankBuilder(){return {name:"",subtitle:"",description:"",
  types:[{id:uid(),name:"",color:SWATCH_CHOICES[0],tagline:"",bring:"",team:"",watch:"",verse:"",verseRef:""},{id:uid(),name:"",color:SWATCH_CHOICES[2],tagline:"",bring:"",team:"",watch:"",verse:"",verseRef:""}],
  questions:[{text:"",typeId:""}]};}
function renderBuilder(){
  if(!STATE.builder)STATE.builder=blankBuilder();const b=STATE.builder;
  app().innerHTML=`
  <button class="back" onclick="go('leaders')">&larr; For Leaders</button>
  <div class="sec-head"><div><h2>Create an assessment</h2><p>Name it, define the strengths it measures, then write questions and assign each to a strength.</p></div></div>
  <div class="panel" style="margin-bottom:18px"><h3 style="font-size:19px;margin-bottom:14px">1 · About this assessment</h3>
    <label class="field"><span class="lab">Name</span><input type="text" value="${esc(b.name)}" placeholder="e.g. Spiritual Gifts" oninput="bSet('name',this.value)"></label>
    <label class="field"><span class="lab">Short subtitle</span><input type="text" value="${esc(b.subtitle)}" placeholder="One line describing it" oninput="bSet('subtitle',this.value)"></label>
    <label class="field"><span class="lab">Description</span><textarea placeholder="A sentence or two shown before someone begins." oninput="bSet('description',this.value)">${esc(b.description)}</textarea></label>
  </div>
  <div class="panel" style="margin-bottom:18px"><h3 style="font-size:19px;margin-bottom:4px">2 · Strengths measured</h3>
    <p class="muted" style="margin-bottom:14px">These are the categories a person can score in. Add 2–8.</p>
    <div id="type-list">${b.types.map((t,i)=>typeEditor(t,i)).join("")}</div>
    <button class="btn sm ghost" onclick="bAddType()">+ Add a strength</button></div>
  <div class="panel" style="margin-bottom:18px"><h3 style="font-size:19px;margin-bottom:4px">3 · Questions</h3>
    <p class="muted" style="margin-bottom:14px">Each is a statement people rate from “Not like me” to “Very like me.” Assign each to one strength (aim for 3–5 per strength).</p>
    <div id="q-list">${b.questions.map((q,i)=>qEditor(q,i)).join("")}</div>
    <button class="btn sm ghost" onclick="bAddQ()">+ Add a question</button></div>
  <div id="b-errors"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn gold" id="saveTestBtn" onclick="bSave()">Save assessment</button><button class="btn ghost" onclick="go('leaders')">Cancel</button></div>`;
}
function typeEditor(t,i){
  return `<div class="type-editor" data-i="${i}"><div class="top">
    <input type="color" class="swatch-pick" value="${t.color}" oninput="bTypeSet(${i},'color',this.value)" aria-label="Color">
    <input type="text" value="${esc(t.name)}" placeholder="Strength name (e.g. The Encourager)" oninput="bTypeSet(${i},'name',this.value)">
    ${STATE.builder.types.length>2?`<button class="mini-x" title="Remove" onclick="bDelType(${i})">&times;</button>`:'<span></span>'}</div>
    <input type="text" value="${esc(t.tagline)}" placeholder="Short tagline (optional)" oninput="bTypeSet(${i},'tagline',this.value)" style="margin-bottom:8px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <textarea placeholder="You bring… (their strength)" oninput="bTypeSet(${i},'bring',this.value)">${esc(t.bring)}</textarea>
      <textarea placeholder="On a team… (how they help)" oninput="bTypeSet(${i},'team',this.value)">${esc(t.team)}</textarea>
      <textarea placeholder="Gentle watch-out (optional)" oninput="bTypeSet(${i},'watch',this.value)">${esc(t.watch)}</textarea>
      <div><input type="text" value="${esc(t.verse)}" placeholder="Scripture (optional)" oninput="bTypeSet(${i},'verse',this.value)" style="margin-bottom:8px"><input type="text" value="${esc(t.verseRef)}" placeholder="Reference (e.g. Romans 12:8 KJV)" oninput="bTypeSet(${i},'verseRef',this.value)"></div>
    </div></div>`;
}
function qEditor(q,i){
  const opts=STATE.builder.types.map(t=>`<option value="${t.id}" ${t.id===q.typeId?'selected':''}>${esc(t.name||"(unnamed)")}</option>`).join("");
  return `<div class="q-editor" data-i="${i}"><input type="text" value="${esc(q.text)}" placeholder="e.g. I naturally encourage people who are discouraged." oninput="bQSet(${i},'text',this.value)"><select onchange="bQSet(${i},'typeId',this.value)"><option value="">— assign strength —</option>${opts}</select><button class="mini-x" title="Remove" onclick="bDelQ(${i})">&times;</button></div>`;
}
function bSet(k,v){STATE.builder[k]=v;}
function bTypeSet(i,k,v){STATE.builder.types[i][k]=v;if(k==="name")refreshQSelects();}
function bQSet(i,k,v){STATE.builder.questions[i][k]=v;}
function bAddType(){if(STATE.builder.types.length>=8)return;STATE.builder.types.push({id:uid(),name:"",color:SWATCH_CHOICES[STATE.builder.types.length%SWATCH_CHOICES.length],tagline:"",bring:"",team:"",watch:"",verse:"",verseRef:""});renderBuilder();}
function bDelType(i){const rid=STATE.builder.types[i].id;STATE.builder.types.splice(i,1);STATE.builder.questions.forEach(q=>{if(q.typeId===rid)q.typeId="";});renderBuilder();}
function bAddQ(){STATE.builder.questions.push({text:"",typeId:""});renderBuilder();}
function bDelQ(i){if(STATE.builder.questions.length>1)STATE.builder.questions.splice(i,1);renderBuilder();}
function refreshQSelects(){document.querySelectorAll('#q-list .q-editor').forEach(el=>{const i=+el.dataset.i,sel=el.querySelector('select'),cur=STATE.builder.questions[i].typeId;sel.innerHTML=`<option value="">— assign strength —</option>`+STATE.builder.types.map(t=>`<option value="${t.id}" ${t.id===cur?'selected':''}>${esc(t.name||"(unnamed)")}</option>`).join("");});}
async function bSave(){
  const b=STATE.builder,errs=[];
  if(!b.name.trim())errs.push("Give your assessment a name.");
  const namedTypes=b.types.filter(t=>t.name.trim());
  if(namedTypes.length<2)errs.push("Add at least two named strengths.");
  const validQs=b.questions.filter(q=>q.text.trim()&&q.typeId);
  if(validQs.length<namedTypes.length*2)errs.push("Add at least two questions per strength (and assign each question to a strength).");
  const covered=new Set(validQs.map(q=>q.typeId));
  namedTypes.forEach(t=>{if(!covered.has(t.id))errs.push(`“${t.name}” has no questions assigned.`);});
  if(errs.length){document.getElementById("b-errors").innerHTML=`<div class="callout warn" style="margin-bottom:16px"><b>Please fix:</b><ul style="margin:6px 0 0;padding-left:18px">${errs.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`;window.scrollTo({top:0});return;}
  const btn=document.getElementById("saveTestBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span>Saving…';
  const test={id:"custom_"+Date.now(),name:b.name.trim(),subtitle:b.subtitle.trim(),description:b.description.trim()||b.name.trim(),minutes:validQs.length+" questions",builtIn:false,scale:{min:1,max:5,lowLabel:"Not like me",highLabel:"Very like me"},types:namedTypes.map(t=>({...t,name:t.name.trim()})),questions:validQs.map(q=>({text:q.text.trim(),typeId:q.typeId}))};
  try{await saveCustomTest(test);STATE.builder=null;go("home");}
  catch(e){btn.disabled=false;btn.innerHTML="Save assessment";document.getElementById("b-errors").innerHTML=`<div class="callout warn" style="margin-bottom:16px"><b>Couldn't save to the shared store.</b><br>${esc(e.message)}</div>`;}
}

/* UTIL */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function clip(s,n){s=String(s||"");return s.length>n?s.slice(0,n-1).trim()+"…":s;}
function uid(){return "t_"+Math.random().toString(36).slice(2,8);}
function initials(n){return String(n||"").trim().split(/\s+/).map(w=>w[0]||"").slice(0,2).join("").toUpperCase()||"?";}
function listJoin(a){a=a.filter(Boolean);if(a.length<=1)return a[0]||"";if(a.length===2)return a[0]+" and "+a[1];return a.slice(0,-1).join(", ")+", and "+a[a.length-1];}
function lower(s){return s?s.charAt(0).toLowerCase()+s.slice(1):s;}
function dl(fn,text){const b=new Blob([text],{type:"text/plain"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);}

/* BOOT */
async function boot(){
  document.getElementById("nav").innerHTML="";
  app().innerHTML=`<div class="panel" style="margin-top:40px"><p><span class="spin"></span>Loading…</p></div>`;
  const slug=new URLSearchParams(location.search).get("church");
  if(CLOUD){
    try{
      const sess=await refreshSession();
      if(sess){
        const mine=await fetchMyChurch();
        if(mine){setChurch(mine,true);await refreshTests();return go("home");}
        return go("newchurch");
      }
    }catch(e){}
    if(slug){
      try{const c=await fetchChurchBySlug(slug);if(c){setChurch(c,false);await refreshTests();return go("home");}}catch(e){}
    }
  }
  go("marketing");
}
boot();
</script>
</body>
</html>
